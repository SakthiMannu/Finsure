<div style="max-width:560px;margin:0 auto">
  <div class="page-header">
    <h1 class="page-title">Mark Loan Delinquent</h1>
    <a routerLink="/app/delinquencies/history" class="btn btn-ghost">
      <span class="material-icons">history</span> History
    </a>
  </div>
  <div class="alert alert-warning">
    <span class="material-icons">info</span>
    The system auto-detects delinquencies every day.
    Use this form only for manual flagging.
  </div>
  <div class="card">
    @if (success) {
      <div class="alert alert-success">
        <span class="material-icons">check_circle</span>
        Delinquency record created for Loan #{{ lastLoanId }}
      </div>
    }
    @if (error) {
      <div class="alert alert-danger">
        <span class="material-icons">error_outline</span> {{ error }}
      </div>
    }
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Loan ID *</label>
        <input type="number" class="form-control" [(ngModel)]="loanId"
               name="loanId" placeholder="Enter loan ID" required>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <input class="form-control" value="DELINQUENT" disabled>
      </div>
      <div class="form-group">
        <label class="form-label">Notes *</label>
        <textarea class="form-control" [(ngModel)]="notes" name="notes"
                  rows="3" placeholder="e.g. EMI overdue for 30 days." required>
        </textarea>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button type="submit" class="btn btn-danger" [disabled]="loading">
          <span class="material-icons">warning</span>
          {{ loading ? 'Saving...' : 'Mark as Delinquent' }}
        </button>
      </div>
    </form>
  </div>
</div>
