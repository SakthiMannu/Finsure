<div style="min-height:100vh;display:flex;align-items:center;
            justify-content:center;background:var(--gray-50);padding:24px">

  <div style="background:white;border-radius:var(--radius-lg);padding:36px;
              box-shadow:var(--shadow-lg);width:100%;max-width:400px">

    
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:var(--warning);border-radius:16px;
                  display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <span class="material-icons" style="color:white;font-size:28px">lock_reset</span>
      </div>
      <h2 style="font-size:22px;margin-bottom:4px">Reset Password</h2>
      <p style="color:var(--gray-400)">Enter your email and new password</p>
    </div>

    @if (success) {
      <div class="alert alert-success">
        <span class="material-icons">check_circle</span>
        Password updated!
        <a routerLink="/login" style="color:inherit;font-weight:600">Sign in now</a>
      </div>
    }

    @if (error) {
      <div class="alert alert-danger">
        <span class="material-icons">error_outline</span> {{ error }}
      </div>
    }

    @if (!success) {
      <form (ngSubmit)="onReset()">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control"
                 [(ngModel)]="email" name="email"
                 placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control"
                 [(ngModel)]="newPassword" name="newPassword"
                 placeholder="Min 5 characters" required>
        </div>
        <button type="submit" class="btn btn-primary w-full"
                style="justify-content:center;padding:12px;margin-top:8px"
                [disabled]="loading">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    }

    <p style="text-align:center;margin-top:16px;color:var(--gray-400);font-size:14px">
      <a routerLink="/login" style="color:var(--primary)">Back to Sign In</a>
    </p>

  </div>
</div>
